<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дзвінок · Твій фінансовий план</title>
<style>
:root{--bg:#FAF6F2;--fg:#1B1620;--muted:#6A6470;--ink:#1B1620}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#F2F0F4;--muted:#ABA7B0;--ink:#F2F0F4}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:28vh 16px 40px;text-align:center}
a.btn{display:block;padding:20px 16px;border-radius:16px;background:#1B1620;color:#fff;font-weight:700;font-size:22px;text-decoration:none}
@media (prefers-color-scheme:dark){a.btn{background:#F2F0F4;color:#141416}}
p{color:var(--muted)}
</style></head>
<body><main>
<p>Кабінет команди «Твій фінансовий план»</p>
<a class="btn" id="go" href="#">📞 Подзвонити</a>
<p id="num"></p>
<p>Якщо дзвінок не почався сам, натисніть кнопку.</p>
</main>
<script>
// Telegram на айфоні не відкриває tel: усередині Mini App, тому кабінет відкриває цю сторінку в браузері, а вона вже дзвонить
var n=(new URLSearchParams(location.search).get('n')||'').replace(/[^\d+]/g,'').slice(0,16);
var go=document.getElementById('go');
if(n){go.href='tel:'+n;document.getElementById('num').textContent=n;setTimeout(function(){location.href='tel:'+n},300)}
else{go.textContent='Номер не передано';go.removeAttribute('href')}
</script>
</body></html>
