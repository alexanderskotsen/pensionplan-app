<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабінет · Твій фінансовий план</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#14171c;--mut:#667085;--line:#e5e7eb;--soft:#f5f6f8;--ink:#14171c;--ink-fg:#fff;--coral:#D63A2C;
--amber:#b45309;--amber-s:#fef3e2;--good:#15803d;--good-s:#e7f6ec;--blue:#2563eb;--blue-s:#eaf1fe;--bad:#b42318;--bad-s:#fdecea;--gray-s:#eceef1;--gray:#4b5563;--shade:rgba(15,20,30,.4)}
:root[data-theme=dark]{--bg:#0f1115;--card:#1a1d23;--fg:#eceef1;--mut:#9aa3b2;--line:#2b303a;--soft:#22262e;--ink:#eceef1;--ink-fg:#14171c;--coral:#ef5a4c;
--amber:#f0a94a;--amber-s:#3a2a12;--good:#4ade80;--good-s:#12301e;--blue:#8ab4ff;--blue-s:#17274a;--bad:#f87171;--bad-s:#3b1716;--gray-s:#2a2f38;--gray:#c3c9d4;--shade:rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#view{display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}
.top>div:first-child{min-width:0;flex:0 0 auto}
.top h1{margin:0;font-size:20px;letter-spacing:-.01em;line-height:1.15}
.top small{display:block;color:var(--mut);font-size:12.5px;font-weight:500;margin-top:1px}
.top .r{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0}
.role{font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--gray-s);color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52vw}
.gear{border:0;background:var(--gray-s);color:var(--gray);width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;padding:0}
.card{background:var(--card);border-radius:14px;padding:12px 14px;min-width:0}
h3{margin:0 0 8px;font-size:12.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
h3 b{color:var(--fg)}
.seg{display:flex;gap:6px}
.seg button{flex:1;font-size:13.5px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;font-weight:600;min-width:0}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
select.pick{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;font-size:14px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;font-size:13.5px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:7px 12px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.chips button i{font-style:normal;opacity:.7;margin-left:4px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:2px}
.task .t{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;min-width:0;cursor:pointer}
.task .t b{font-size:15.5px;overflow-wrap:anywhere}
.task .m{grid-column:1;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere;cursor:pointer}
.call{grid-row:1/3;grid-column:2;background:var(--ink);color:var(--ink-fg);border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px;white-space:nowrap;border:0;display:inline-block;text-align:center}
.call.sm{padding:8px 10px;font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap;background:var(--gray-s);color:var(--gray)}
.tag.late{background:var(--amber-s);color:var(--amber)}.tag.new{background:var(--blue-s);color:var(--blue)}
.tag.ok{background:var(--good-s);color:var(--good)}.tag.bad{background:var(--bad-s);color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-of-type{border-top:0}
.row>span:last-child{color:var(--mut);white-space:nowrap;flex:0 0 auto}
.row>span:first-child{min-width:0;overflow-wrap:anywhere}
.row b.v{color:var(--fg)}.row b.w{color:var(--amber)}
.fun{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;margin-bottom:4px}
.fun div{background:var(--soft);border-radius:9px;padding:7px 2px 6px;min-width:0}
.fun b{display:block;font-size:17px}
.fun span{font-size:10.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .r{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;align-items:center;gap:8px;font-size:13.5px;margin:6px 0}
.bars i{display:block;height:9px;border-radius:5px;background:var(--ink);min-width:3px}
.bars .r:nth-child(n+4) i{background:var(--good)}
.bars em{font-style:normal;text-align:right;font-weight:700;white-space:nowrap}
.bars em small{font-weight:500;color:var(--mut);margin-left:3px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:7px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font-size:11px;color:var(--mut);font-weight:600;border-top:0;padding-top:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;white-space:normal;overflow-wrap:break-word;padding-right:8px}
.tbl tr:first-child td{border-top:0}
.tbl th+th,.tbl td+td{padding-left:8px}
.arow{padding:9px 0;border-top:1px solid var(--line)}.arow:first-of-type{border-top:0;padding-top:2px}.arow .mini b{color:var(--fg)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.list{display:flex;flex-direction:column;gap:8px}
.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--card);border-radius:14px;padding:11px 12px 11px 14px}
.lead .t{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;cursor:pointer;min-width:0}
.lead .t b{font-size:15.5px;overflow-wrap:anywhere}
.lead .m{grid-column:1;color:var(--mut);font-size:12.5px;cursor:pointer;overflow-wrap:anywhere}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:14px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15.5px;background:var(--ink);color:var(--ink-fg)}
.btn small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:1px}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:14px;font-weight:600;padding:11px 6px}
.btn.ghost{background:none;color:var(--mut);font-weight:600;font-size:13.5px;padding:8px}
.btn.danger{background:var(--bad-s);color:var(--bad);font-size:14px;font-weight:600;padding:11px 6px}
.btn:disabled{opacity:.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.o{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 3px;text-align:center;font-size:13px;font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.o.on{border-color:var(--ink);background:var(--ink);color:var(--ink-fg)}
.o span{display:block;font-size:16px;margin-bottom:1px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchips button{border:1px solid var(--line);border-radius:16px;padding:7px 11px;font-size:13px;font-weight:600;background:var(--card)}
.pchips button:active{background:var(--blue-s);border-color:var(--blue);color:var(--blue)}
.next{font-size:13.5px;font-weight:600;margin:0 0 8px;color:var(--fg);overflow-wrap:anywhere}
.next.late{color:var(--amber)}
textarea.note,input.txt{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:15px}
textarea.note{min-height:64px;resize:vertical;margin-top:8px;display:block}
ul.hooks{margin:0;padding-left:18px}ul.hooks li{margin:3px 0;font-size:14px;overflow-wrap:anywhere}
.mini{font-size:12.5px;color:var(--mut);line-height:1.45;overflow-wrap:anywhere}
details summary{font-size:13.5px;font-weight:600;cursor:pointer;margin-top:8px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" →"}details[open] summary::after{content:" ↓"}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
dt{color:var(--mut)}dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.tl{font-size:13px;color:var(--mut);margin:3px 0;overflow-wrap:anywhere}.tl b{color:var(--fg);font-weight:600}.tl.team{color:var(--fg)}
.tree{display:flex;flex-direction:column}
.node{display:flex;align-items:center;gap:8px;padding:9px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.node:first-child{border-top:0}
.node .ind{color:var(--mut);flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:0 0 auto;display:inline-block}
.dot.wait{background:#e0a23c}.dot.off{background:#b8bec9}
.node .nm{flex:1;min-width:0}
.node .nm b{display:block;font-weight:600;overflow-wrap:break-word;word-break:normal}
.node .nm small{color:var(--mut);font-size:12px;display:block}
.node .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.lv{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.lv button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;font-size:13.5px}
.lv button.on{background:var(--ink);border-color:var(--ink);color:var(--ink-fg);font-weight:700}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.lnk:first-of-type{border-top:0}
.lnk code{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
.lnk button,.vrow button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;flex:0 0 auto}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.vrow:first-of-type{border-top:0}.vrow button{color:var(--bad)}
.invite{background:var(--card);border:1px dashed var(--mut);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar button{border:0;background:none;text-align:center;font-size:11px;color:var(--mut);font-weight:600;padding:0;position:relative}
.bar i{display:block;font-style:normal;font-size:19px;margin-bottom:1px;filter:grayscale(1);opacity:.75}
.bar .on{color:var(--fg)}.bar .on i{filter:none;opacity:1}
.bar em{font-style:normal;background:var(--coral);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;position:absolute;top:-2px;left:calc(50% + 6px)}
.sheet-bg{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 0;flex:0 0 auto}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 2px 0}
.sh>div:first-child{min-width:0;flex:1}
.sh h2{margin:0;font-size:20px;letter-spacing:-.01em;overflow-wrap:break-word;word-break:normal}
.sh .tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px}
.sh .tags .tag{margin-top:0}
.phone-ro{font-size:17px;font-weight:700;letter-spacing:.01em;user-select:all}
.sh .sub{font-size:13px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.sh .tag{font-size:12.5px;padding:4px 9px;margin-top:2px;flex:0 0 auto}
.x{border:0;background:var(--gray-s);color:var(--gray);width:30px;height:30px;border-radius:50%;font-size:15px;flex:0 0 auto;padding:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14171c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;text-align:center}
.err{background:var(--card);border-radius:14px;padding:22px 16px;text-align:center;line-height:1.5}
.load{color:var(--mut);text-align:center;padding:30px 0;font-size:14px}
[hidden]{display:none!important}
@media (max-width:350px){.call{padding:9px 9px;font-size:13px}.bars .r{grid-template-columns:84px minmax(0,1fr) 70px}.o{font-size:12px}.node{gap:6px}.sh h2{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 id="title">Кабінет</h1><small id="subtitle"></small></div>
    <div class="r"><span class="role" id="role" hidden></span><button class="gear" id="gear" hidden aria-label="Налаштування">⚙</button></div></div>
  <div id="view"><div class="load">Завантаження…</div></div>
</div>
<div class="bar" id="bar" hidden>
  <button data-t="td"><i>📞</i>Сьогодні<em id="badge" hidden></em></button>
  <button data-t="ld"><i>📋</i>Заявки</button>
  <button data-t="fn"><i>📊</i>Воронка</button>
  <button data-t="tm"><i>🌳</i>Команда</button>
</div>
<div id="sheet" class="sheet-bg" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const P = new URLSearchParams(location.search);
const API = (P.get('api') || '').replace(/\/$/, '');
const INIT = (tg && tg.initData) || '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString('uk-UA');
const money = n => n ? num(Math.round(n)) + ' грн' : '';
const dt = ts => { if (!ts) return ''; const d = new Date(ts * 1000); return d.toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', timeZone:'Europe/Kyiv'}) + ' ' + d.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Kyiv'}); };
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '';
const haptic = t => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* Тема: світла за замовчуванням; «як у Telegram» вмикається в ⚙ і тоді слухає colorScheme */
function applyTheme() {
  const dark = store.get('cab_theme') === 'tg' && tg && tg.colorScheme === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = dark ? '#0f1115' : '#f3f4f6';
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
}
try { tg.ready(); tg.expand(); tg.onEvent('themeChanged', applyTheme); } catch (e) {}
applyTheme();

/* Помилки сервера зрозумілою мовою: службові коди (forbidden, not found, HTTP 500) людині не показуємо */
const ERR_CODES = { forbidden: 1, 'not found': 1, 'bad request': 1, auth: 1, server: 1 };
function errText(status, msg) {
  if (msg && !ERR_CODES[msg]) return msg;  // сервер уже пояснив українською («Цей час уже минув»)
  if (status === 401) return 'Telegram не підтвердив вхід. Закрийте і відкрийте кабінет ще раз.';
  if (status === 403) return 'Немає доступу: це може зробити лише той, хто веде заявку, або головний адмін.';
  if (status === 404) return 'Не знайшов. Можливо, запис уже видалено.';
  if (status >= 500) return 'Сервер тимчасово не відповідає. Спробуйте ще раз за хвилину.';
  return 'Не вдалося виконати дію. Спробуйте ще раз.';
}
async function api(path, data) {
  let r;
  try {
    r = await fetch(API + path, {
      method: data ? 'POST' : 'GET',
      headers: Object.assign({'X-Init-Data': INIT}, data ? {'Content-Type': 'application/json'} : {}),
      body: data ? JSON.stringify(data) : undefined,
    });
  } catch (e) { const err = new Error('Немає зв\'язку з сервером. Перевірте інтернет і спробуйте ще раз.'); err.status = 0; throw err; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(errText(r.status, j.error)); e.status = r.status; throw e; }
  return j;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
function confirmBox(text, cb) { if (tg && tg.showConfirm) { try { return tg.showConfirm(text, ok => ok && cb()); } catch (e) {} } if (window.confirm(text)) cb(); }
function openLink(url) { if (/^https:\/\/t\.me\//.test(url) && tg && tg.openTelegramLink) { try { return tg.openTelegramLink(url); } catch (e) {} } window.open(url, '_blank'); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Скопійовано'); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Скопійовано'); } catch (e2) { toast('Не вдалося скопіювати'); } t.remove(); }
}

const S = { me: null, tab: 'td', days: 7, scope: 'me', agent: '', status: 'new', q: '', team: null };
const ROLE = { admin: 'Головний адмін', viewer: 'Перегляд', agent: 'Консультант' };
const TITLES = { td: 'Сьогодні', ld: 'Заявки', fn: 'Воронка', tm: 'Команда' };
const isAgent = () => S.me.role === 'agent';
const hasTeam = () => isAgent() && S.me.agent.team > 0;
/* чиї заявки показуємо: консультант — свої або гілка; адмін — усі або один консультант */
const scopeQ = (branch) => isAgent() ? 'scope=' + (S.scope === 'me' ? 'me' : (branch || 'branch')) : (S.agent ? 'agent=' + encodeURIComponent(S.agent) : '');
function scopeUI(fn) {
  if (hasTeam()) return `<div class="seg">${[['me', 'Я'], ['branch', 'Я + команда']].map(([k, n]) => `<button class="${S.scope === k ? 'on' : ''}" onclick="S.scope='${k}';${fn}()">${n}</button>`).join('')}</div>`;
  if (!isAgent() && S.me.agents && S.me.agents.length > 1) return `<select class="pick" onchange="S.agent=this.value;${fn}()"><option value="">Усі консультанти</option>${S.me.agents.map(a => `<option value="${esc(a.code)}" ${S.agent === a.code ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>`;
  return '';
}

/* ---------- старт ---------- */
async function boot() {
  if (!API) return fail('Кабінет відкрито без адреси сервера. Відкрийте його кнопкою «Кабінет» у боті.');
  if (!INIT) return fail('Відкрийте кабінет у Telegram: кнопка «Кабінет» у боті.');
  try { S.me = await api('/api/me'); }
  catch (e) {

  if (sh.clicked || sh.came || (sh.places || []).length) {
    const st = [['Натиснули «поділитися»', sh.clicked], ['Прийшли за запрошенням', sh.came], ['Порахували', sh.calc], ['Записались', sh.leads], ['Поліс', sh.policies]];
    h += `<div class="card"><h3><span>Поділитися</span><span>${sh.on ? 'увімкнено' : 'вимкнено'}</span></h3>
    ${st.map(x => `<div class="row"><span>${x[0]}</span><span><b class="v">${num(x[1] || 0)}</b></span></div>`).join('')}
    ${sh.per_sharer === null || sh.per_sharer === undefined ? '' : `<div class="mini" style="margin-top:6px">На одного, хто поділився, прийшло ${String(sh.per_sharer).replace('.', ',')} (поділились: ${num(sh.sharers)}).</div>`}
    ${(sh.places || []).length ? `<h3 style="margin-top:12px"><span>За місцем</span></h3>${sh.places.map(p => `<div class="row"><span>${esc(p.name)}${p.shown === null ? '' : `<br><span class="mini">показали: ${num(p.shown)}</span>`}</span><span><b class="v">${p.clicked === null ? '·' : num(p.clicked)} → ${num(p.came)} → ${num(p.calc)} → ${num(p.leads)} → ${num(p.policies)}</b></span></div>`).join('')}
    <div class="mini" style="margin-top:6px">Натиснули → прийшли → порахували → записались → поліс. У портреті й після запису кнопка одразу відкриває Telegram, тому натискань там не видно: показуємо, скільком людям її показали.</div>` : ''}</div>`;
  }
  $('#view').innerHTML = h;
}

/* ---------- команда ---------- */
const pl = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11) ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many;
const ppl = n => pl(n, 'людина', 'людини', 'людей');
async function renderTeam() {
  loading();
  let d; try { d = await api('/api/team'); } catch (e) { return errView(e); }
  if (S.tab !== 'tm') return;
  S.team = d;
  const kids = {}; d.nodes.forEach(n => (kids[n.parent || ''] = kids[n.parent || ''] || []).push(n));
  const rows = [];
  (function walk(p, depth) { (kids[p] || []).forEach(n => { rows.push([n, depth]); walk(n.code, depth + 1); }); })('', 0);
  const total = d.nodes.filter(n => !n.me).length;
  let h = '';
  if (S.me.role !== 'viewer') h += `<button class="btn" onclick="inviteSheet(${isAgent() ? `'${S.me.agent.code}'` : 'null'})">＋ Запросити в команду</button>`;
  h += `<div class="card"><h3><span>${isAgent() ? 'Моя гілка' : 'Структура'}</span><b>${total} ${ppl(total)}</b></h3>`;
  if (!rows.length || (rows.length === 1 && rows[0][0].me)) h += `<div class="empty">Команди ще немає. Натисніть «Запросити в команду», введіть ім'я і перешліть людині посилання.</div>`;
  const step = window.innerWidth <= 350 ? 10 : 16;  // на вузькому менший відступ, щоб імена не різались
  h += `<div class="tree">${rows.map(([n, dep]) => `<button class="node" style="padding-left:${4 + Math.min(dep, 6) * step}px" onclick="agentSheet('${n.code}')">
      ${dep ? '<span class="ind">└</span>' : ''}<span class="dot ${n.state}"></span>
      <span class="nm"><b>${n.me ? 'Ви · ' : ''}${esc(n.name)}</b><small>${num(n.users)} ${pl(n.users, 'людина', 'людини', 'людей')} · ${num(n.leads)} ${pl(n.leads, 'заявка', 'заявки', 'заявок')} · ${num(n.contracts)} ${pl(n.contracts, 'поліс', 'поліси', 'полісів')}${n.resp ? ' · відповідь ' + esc(n.resp) : ''}</small>${n.idle || n.level ? `<span class="tg">${n.idle ? `<span class="tag late">без дії ${n.idle}</span>` : ''}${n.level ? `<span class="tag">рів. ${n.level}</span>` : ''}</span>` : ''}</span></button>`).join('')}</div>`;
  h += `<div class="legend"><span><i class="dot"></i>підключений</span><span><i class="dot wait"></i>ще не підключився</span><span><i class="dot off"></i>вимкнений</span></div>
    <div class="mini" style="margin-top:6px">Цифри за 30 днів. «Без дії» означає нові заявки, яким ще ніхто не дзвонив. Відступ показує, хто в чиїй команді.</div></div>`;
  $('#view').innerHTML = h;
}
let CUR = null;
async function agentSheet(code, days) {
  days = days ?? 30;
  let a; try { a = await api('/api/agent?code=' + encodeURIComponent(code)); } catch (e) { return toast('Помилка: ' + e.message); }
  CUR = a;
  const s = a.stats[String(days)], st = { on: 'підключений', wait: 'ще не підключився', off: 'вимкнений' }[a.state];
  let h = `<div class="sh"><div><h2>${esc(a.name)}</h2><div class="sub"><span class="dot ${a.state}" style="margin-right:5px"></span>${st}${a.level ? ' · рівень ' + a.level : ''}${a.boss ? ' · керівник: ' + esc(a.boss) : ''}</div></div><button class="x" onclick="closeSheet()">✕</button></div>`;
  h += `<div class="seg">${[[7, '7 днів'], [30, '30 днів'], [0, 'Усі']].map(([k, n]) => `<button class="${days === k ? 'on' : ''}" onclick="agentSheet('${code}',${k})">${n}</button>`).join('')}</div>`;
  h += `<div class="card"><div class="fun" style="grid-template-columns:repeat(3,1fr);margin:0"><div><b>${num(s.users)}</b><span>людей у боті</span></div><div><b>${num(s.leads)}</b><span>заявок</span></div><div><b>${num(s.contracts)}</b><span>полісів</span></div></div>
    ${s.leads <= s.users ? `<div class="row" style="margin-top:6px"><span>Перехід у заявку</span><span><b class="v">${pct(s.leads, s.users) || '0%'}</b></span></div>` : ''}
    <div class="row"><span>У команді</span><span><b class="v">${a.team}</b></span></div>${a.team ? `<div class="row"><span>Команда: людей · заявок · полісів</span><span><b class="v">${num(s.team.users)} · ${num(s.team.leads)} · ${num(s.team.contracts)}</b></span></div>` : ''}</div>`;
  if (!isAgent()) h += `<button class="btn sec" onclick="S.agent='${code}';S.status='all';closeSheet();go('ld')">📋 Заявки цього консультанта</button>`;
  if (a.can_level) h += `<div class="card"><h3><span>Рівень Starlife</span></h3><div class="lv">${Array.from({length: 16}, (_, i) => i + 1).map(n => `<button class="${a.level === n ? 'on' : ''}" onclick="setLevel('${code}',${n},${days})">${n}</button>`).join('')}</div>
      <button class="btn ghost" onclick="setLevel('${code}',0,${days})">Прибрати рівень</button></div>`;
  if (a.can_invite) h += `<button class="btn sec" onclick="reinvite('${code}')">🔗 Нове запрошення (ще не підключився)</button>`;
  if (a.can_add_under && S.me.role !== 'viewer') h += `<button class="btn sec" onclick="inviteSheet('${code}',true)">＋ Запросити людину в цю гілку</button>`;
  h += linksCard(a.links, 'Посилання для клієнтів');
  if (a.can_admin) h += `<div class="g2"><button class="btn sec" onclick="renameSheet('${code}')">✏️ Перейменувати</button>
      <button class="btn ${a.state === 'off' ? 'sec' : 'danger'}" onclick="toggleAgent('${code}',${a.state === 'off'})">${a.state === 'off' ? '✅ Увімкнути' : '⛔ Вимкнути'}</button></div>`;
  openSheet(h);
}
function linksCard(links, title) {
  return `<div class="card"><h3><span>${title}</span></h3>${links.map(l => `<div class="lnk"><div style="min-width:0"><b>${esc(l.name)}</b><code>${esc(l.url)}</code></div><button onclick="copy('${esc(l.url)}')">Копіювати</button></div>`).join('')}
  <div class="mini" style="margin-top:6px">Хто прийде за посиланням, закріпиться за цим консультантом. Мітка показує, з якої соцмережі людина.</div></div>`;
}
async function setLevel(code, lvl, days) { try { await api('/api/level', { code, level: lvl }); haptic(); agentSheet(code, days); renderTeam(); } catch (e) { toast('Помилка: ' + e.message); } }
function toggleAgent(code, on) {
  const go2 = async () => { try { await api('/api/agent_update', { code, active: on }); toast(on ? 'Увімкнено' : 'Вимкнено'); agentSheet(code); renderTeam(); } catch (e) { toast('Помилка: ' + e.message); } };
  if (on) return go2();
  confirmBox('Вимкнути консультанта? Нові люди за його посиланнями закріплюватимуться за вами, старі клієнти залишаться за ним.', go2);
}
function renameSheet(code) {
  const name = CUR ? CUR.name : '';
  openSheet(`<div class="sh"><div><h2>Нове ім'я</h2></div><button class="x" onclick="agentSheet('${code}')">✕</button></div>
    <input class="txt" id="nn" value="${esc(name)}" maxlength="60"><button class="btn" onclick="doRename('${code}')">Зберегти</button>`);
}
async function doRename(code) { try { await api('/api/agent_update', { code, name: $('#nn').value }); toast('Збережено'); agentSheet(code); renderTeam(); } catch (e) { toast(e.message); } }
function inviteSheet(parent, fromCard) {
  const parentName = fromCard && CUR ? CUR.name : null;
  openSheet(`<div class="sh"><div><h2>Запросити в команду</h2><div class="sub">${parentName ? 'У команду: ' + esc(parentName) : S.me.role === 'admin' ? 'Напряму під вами' : 'У вашу команду'}</div></div><button class="x" onclick="closeSheet()">✕</button></div>
    <input class="txt" id="iname" placeholder="Ім'я і прізвище" maxlength="60">
    <button class="btn" id="ibtn" onclick="doInvite(${parent ? `'${parent}'` : 'null'})">Створити запрошення</button>
    <div class="mini">Бот дасть одноразове посилання. Людина натисне його і «Почати», і стане консультантом у цій гілці. Ви отримаєте сповіщення.</div>`);
  setTimeout(() => $('#iname') && $('#iname').focus(), 100);
}
async function doInvite(parent) {
  const b = $('#ibtn'); b.disabled = true;
  try { showInvite(await api('/api/invite', { name: $('#iname').value, parent })); if (S.tab === 'tm') renderTeam(); }
  catch (e) { toast(e.message); b.disabled = false; }
}
async function reinvite(code) { try { showInvite(await api('/api/reinvite', { code })); } catch (e) { toast('Помилка: ' + e.message); } }
let INV = null;
function showInvite(r) {
  INV = r;
  openSheet(`<div class="sh"><div><h2>Запрошення готове ✅</h2><div class="sub">Надішліть його людині</div></div><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="invite">${esc(r.text)}</div>
    <button class="btn" onclick="openLink(INV.share)">📤 Надіслати в Telegram</button>
    <button class="btn sec" onclick="copy(INV.text)">Скопіювати текст</button>
    <div class="mini">Посилання одноразове. Якщо людина його загубить, відкрийте її картку і натисніть «Нове запрошення».</div>`);
}

/* ---------- ⚙: посилання, Excel, доступ, тема ---------- */
let VIEWERS = [];
async function settingsSheet() {
  const me = S.me, tgTheme = store.get('cab_theme') === 'tg';
  let h = `<div class="sh"><div><h2>Налаштування</h2><div class="sub">${esc(ROLE[me.role])}${me.agent ? ' · ' + esc(me.agent.name) : ''}</div></div><button class="x" onclick="closeSheet()">✕</button></div>`;
  if (me.agent) h += linksCard(me.agent.links, 'Мої посилання для клієнтів');
  if (me.role !== 'agent') h += `<div class="card"><h3><span>База в Excel</span></h3><div class="mini" style="margin-bottom:8px">Люди й заявки одним файлом. Прийде в чат з ботом.</div><button class="btn sec" onclick="sendExcel(this)">📥 Надіслати файл у чат</button></div>`;
  if (me.role === 'admin') h += `<div class="card" id="acc"><h3><span>Доступ на перегляд</span></h3><div class="load" style="padding:8px 0">Завантаження…</div></div>`;
  h += `<div class="card"><h3><span>Тема</span></h3><div class="seg"><button class="${tgTheme ? '' : 'on'}" onclick="setTheme('light')">Світла</button><button class="${tgTheme ? 'on' : ''}" onclick="setTheme('tg')">Як у Telegram</button></div></div>`;
  openSheet(h);
  if (me.role === 'admin') drawAccess();
}
function setTheme(v) { store.set('cab_theme', v); applyTheme(); settingsSheet(); }
async function sendExcel(b) { b.disabled = true; try { await api('/api/export', {}); toast('Файл надіслано в чат з ботом'); } catch (e) { toast('Помилка: ' + e.message); } b.disabled = false; }
async function drawAccess() {
  let d; try { d = await api('/api/viewers'); } catch (e) { if ($('#acc')) $('#acc').innerHTML = `<div class="mini">Помилка: ${esc(e.message)}</div>`; return; }
  VIEWERS = d.viewers; if (!$('#acc')) return;
  $('#acc').innerHTML = `<h3><span>Доступ на перегляд</span><b>${d.viewers.length}</b></h3><div class="mini" style="margin-bottom:6px">Бачать усі заявки, воронку, команду і можуть отримати Excel. Нічого не змінюють.</div>
    ${d.viewers.map(v => `<div class="vrow"><span>${esc(v.name)} <small style="color:var(--mut)">${v.env ? '(вписаний у Render)' : 'ID ' + v.id}</small></span>${v.env ? '' : `<button onclick="removeViewer(${v.id})">Забрати</button>`}</div>`).join('')}
    <div class="g2" style="margin-top:8px;grid-template-columns:minmax(0,1fr) auto"><input class="txt" id="vid" inputmode="numeric" placeholder="Telegram ID"><button class="btn" style="width:auto;padding:10px 14px;font-size:14px" onclick="addViewer(this)">Додати</button></div>
    <div class="mini" style="margin-top:8px">ID людина дізнається в @userinfobot. Або в боті: «⚙️ Ще», «👁 Доступ» і переслати її повідомлення. Людина має хоч раз натиснути «Почати» в боті.</div>`;
}
async function addViewer(b) {
  b.disabled = true;
  try { const r = await api('/api/viewer_add', { id: $('#vid').value }); toast(r.reached ? `✅ ${r.name}: доступ відкрито` : `✅ Додано. Хай ${r.name} натисне «Почати» в боті`); drawAccess(); }
  catch (e) { toast(e.message); b.disabled = false; }
}
function removeViewer(id) { const name = (VIEWERS.find(v => v.id === id) || {}).name || id; confirmBox(`Забрати доступ у ${name}?`, async () => { try { await api('/api/viewer_remove', { id }); toast('Доступ забрано'); drawAccess(); } catch (e) { toast(e.message); } }); }

/* ---------- шторка ---------- */
function openSheet(h) { const bg = $('#sheet'); const keep = bg.firstElementChild ? bg.firstElementChild.scrollTop : 0, same = !bg.hidden; bg.innerHTML = `<div class="sheet"><div class="grab"></div>${h}</div>`; bg.hidden = false; if (same && openSheet.id === h.slice(0, 80)) bg.firstElementChild.scrollTop = keep; openSheet.id = h.slice(0, 80); bg.onclick = e => { if (e.target === bg) closeSheet(); }; document.body.style.overflow = 'hidden'; try { tg.BackButton.show(); } catch (e) {} }
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; document.body.style.overflow = ''; try { tg.BackButton.hide(); } catch (e) {} }
try { tg.BackButton.onClick(closeSheet); } catch (e) {}
/* Повернулись у кабінет (з чату чи після дзвінка): оновити «Сьогодні» / список, якщо картка не відкрита */
function refreshVisible() {
  if (!S.me || document.visibilityState !== 'visible' || !$('#sheet').hidden) return;
  if (S.tab === 'td') renderToday(); else if (S.tab === 'ld') loadLeads();
}
document.addEventListener('visibilitychange', refreshVisible);
try { tg.onEvent('activated', refreshVisible); } catch (e) {}

boot();
</script>
</body>
</html>
