<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Капітал за 60 секунд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}html,body{margin:0}

.navtabs{display:flex;background:#e2e7ee;border-radius:10px;padding:3px;margin:0 auto 10px;max-width:520px;gap:2px}
.navtabs button{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;padding:9px 0;font:600 12.5px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#4f5868;border-radius:8px;cursor:pointer}
.navtabs button.on{background:#fff;color:#151b26;box-shadow:0 1px 2px rgba(0,0,0,.08)}
[hidden]{display:none!important}
/* Layout: phone column — HUD (capital, age bar), play field canvas, overlays for start/end screens. Light, bright, money-themed. */
:root{
  --bg:#eef4f1; --card:#ffffff; --fg:#13241c; --muted:#5a6d63; --line:#d6e2dc;
  --accent:#0f8a5f; --accent-ink:#ffffff; --accent-soft:#e1f3eb;
  --gold:#e8a317; --bad:#c8372c; --bad-soft:#fbe7e5; --violet:#6d4fd6; --blue:#2a78d6;
  --sky1:#dff1ff; --sky2:#f6fbf8;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --card:#17221d; --fg:#e6f0eb; --muted:#94a89e; --line:#28372f;
  --accent:#3cc48f; --accent-ink:#06261a; --accent-soft:#163428; --bad:#f0857a; --bad-soft:#3a1d1a;
  --sky1:#13212b; --sky2:#121b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --card:#17221d; --fg:#e6f0eb; --muted:#94a89e; --line:#28372f;
  --accent:#3cc48f; --accent-ink:#06261a; --accent-soft:#163428; --bad:#f0857a; --bad-soft:#3a1d1a;
  --sky1:#13212b; --sky2:#121b17; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{font-family:var(--font);font-size:15px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 16px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;display:grid;gap:8px}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:end}
.cap{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.capk{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.right{text-align:right;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.right b{color:var(--fg)}
.age{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.agebar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.agebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px}
.badges{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.badge{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.badge.v{background:#ece7fb;color:var(--violet)} .badge.b{background:#e3eefb;color:var(--blue)}
.stage{position:relative;width:100%;aspect-ratio:2/3;max-height:calc(100vh - 220px);max-height:calc(100dvh - 220px);margin:0 auto;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:var(--card);touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.over{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:color-mix(in srgb,var(--card) 92%,transparent);overflow-y:auto}
.over .in{display:grid;gap:12px;justify-items:center;text-align:center;max-width:340px;width:100%}
h1{font-size:1.7rem;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.25rem;margin:0}
.lead{margin:0;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;text-align:left;font-size:.82rem}
.legend div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:6px 8px}
.legend canvas{width:30px;height:30px}
.legend b{display:block;font-size:.82rem}
.legend span{color:var(--muted);font-size:.74rem}
.btn{font:inherit;font-weight:700;width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.05rem}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{font:inherit;font-size:.78rem;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted);cursor:pointer}
.res{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.split div{background:var(--bg);border-radius:10px;padding:10px}
.split b{display:block;font-variant-numeric:tabular-nums}
.split span{font-size:.75rem;color:var(--muted)}
.grade{font-weight:700;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.grade.low{background:var(--bad-soft);color:var(--bad)}
.tip{font-size:.88rem;background:var(--accent-soft);border-radius:10px;padding:10px 12px;text-align:left}
.fine{font-size:.72rem;color:var(--muted);margin:0}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem;font-weight:900;color:var(--accent);pointer-events:none;text-shadow:0 2px 0 var(--card)}
.navtabs{overflow-x:auto;scrollbar-width:none}.navtabs::-webkit-scrollbar{display:none}.navtabs button{flex:0 0 auto;padding:9px 12px}
</style>
</head>

<script>
function navGo(page, tab){ const q = new URLSearchParams(location.search); q.delete('tab'); if (tab) q.set('tab', tab); const s = q.toString(); location.href = page + (s ? '?' + s : ''); }
</script>

<div class="app">
  <div class="hud">
    <div><div class="capk">Капітал</div><div class="cap" id="cap">0 грн</div></div>
    <div class="right">внесено <b id="dep">0 грн</b><br>рекорд <b id="best">0 грн</b> <button class="mini" id="mute" type="button">звук: так</button></div>
    <div class="age"><span id="ageL">30 р.</span><div class="agebar"><i id="ageBar"></i></div><span>60 р.</span></div>
    <div class="badges" id="badges"></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Ігрове поле: ловіть внески скарбничкою"></canvas>
    <div class="count" id="count" hidden></div>
    <div class="over" id="over"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const BOT_USERNAME = new URLSearchParams(location.search).get('bot') || '';
const W = 360, H = 540, GAME_S = 60, YEARS = 30, RATE = 0.08;

// ---------- Telegram ----------
const TW = window.Telegram && window.Telegram.WebApp;
const tg = TW && TW.platform && TW.platform !== 'unknown' ? TW : null;
if (tg) { try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const haptic = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };
function openLink(url){ try { if (tg) { tg.openTelegramLink(url); return; } } catch (e) {} const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---------- Звук ----------
const A = { ctx:null, on:load('c60_sound', true) };
function ainit(){ if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; } const C = window.AudioContext || window.webkitAudioContext; if (!C) return; A.ctx = new C(); A.g = A.ctx.createGain(); A.g.gain.value = 0.5; A.g.connect(A.ctx.destination); }
function tone(type, f, t0, dur, vol, f2){ if (!A.ctx || !A.on) return; const c = A.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(A.g); o.start(t); o.stop(t + dur + 0.05); }
const SND = {
  coin:() => { tone('square', 1319, 0, 0.06, 0.12); tone('square', 1760, 0.05, 0.1, 0.1); },
  bill:() => { tone('triangle', 784, 0, 0.08, 0.2); tone('triangle', 1175, 0.06, 0.12, 0.18); },
  gold:() => [1047,1319,1568,2093].forEach((f, k) => tone('square', f, k * 0.05, 0.12, 0.1)),
  trap:() => { tone('sawtooth', 300, 0, 0.35, 0.18, 70); },
  block:() => { tone('triangle', 1400, 0, 0.2, 0.2, 2000); },
  shield:() => [659,880,1175].forEach((f, k) => tone('sine', f, k * 0.06, 0.2, 0.2)),
  boost:() => [523,659,784,1047,1319].forEach((f, k) => tone('square', f, k * 0.04, 0.1, 0.08)),
  tick:() => tone('sine', 880, 0, 0.08, 0.15),
  end:() => [523,659,784,1047,784,1047].forEach((f, k) => tone('triangle', f, k * 0.12, 0.25, 0.2))
};
function setSnd(){ $('mute').textContent = 'звук: ' + (A.on ? 'так' : 'ні'); }

// ---------- Полотно ----------
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
let scale = 1;
function resize(){ const r = stage.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); scale = cv.width / W; }
window.addEventListener('resize', resize);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- Предмети ----------
const TYPES = {
  coin:  { good:true, val:100,  r:13, label:'100' },
  bill:  { good:true, val:500,  r:16, label:'500' },
  gold:  { good:true, val:2000, r:17, label:'2000' },
  policy:{ ins:true, r:18, name:'Поліс страхування життя', short:'Поліс', col:'#0f8a5f' },
  med:   { ins:true, r:16, name:'Медична страховка', short:'Медична', col:'#d9473a' },
  auto:  { ins:true, r:16, name:'Автоцивілка', short:'Авто', col:'#6d4fd6' },
  home:  { ins:true, r:16, name:'Страхування житла', short:'Житло', col:'#2a78d6' },
  boost: { power:true, r:16 },
  credit:{ trap:true, r:20, label:'КРЕДИТ', txt:'Кредит: −20% капіталу' },
  env:   { trap:true, r:20, label:'КОНВЕРТ', txt:'Зарплата в конверті: −1 000 грн і рік без стажу' },
  scam:  { trap:true, r:20, label:'30%!', txt:'Шахрайські «30% на місяць»: −30% капіталу' },
  buy:   { trap:true, r:20, label:'ХОЧУ!', txt:'Імпульсивна покупка: −1 500 грн' }
};
function drawItem(g, type, x, y, k){
  const t = TYPES[type]; k = k || 1;
  g.save(); g.translate(x, y); g.scale(k, k);
  if (type === 'coin' || type === 'gold') {
    g.fillStyle = type === 'gold' ? '#f5b81c' : '#f2c94c'; g.beginPath(); g.arc(0, 0, t.r, 0, 7); g.fill();
    g.strokeStyle = '#b88a10'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#8a6400'; g.font = '800 ' + (type === 'gold' ? 9 : 10) + 'px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t.label, 0, 1);
    if (type === 'gold') { g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, t.r + 4, -0.6, 0.6); g.stroke(); }
  } else if (type === 'bill') {
    g.fillStyle = '#5fbf7f'; roundRect(g, -20, -12, 40, 24, 4); g.fill(); g.strokeStyle = '#2f8a50'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#1f6b3a'; g.font = '800 11px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('500', 0, 1);
  } else if (t.ins) {
    const big = type === 'policy' ? 1.15 : 1; g.scale(big, big);
    g.fillStyle = t.col; g.beginPath(); g.moveTo(0, -17); g.lineTo(14, -11); g.lineTo(12, 6); g.quadraticCurveTo(6, 14, 0, 18); g.quadraticCurveTo(-6, 14, -12, 6); g.lineTo(-14, -11); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineWidth = 2.5;
    if (type === 'policy') { g.beginPath(); g.moveTo(0, 7); g.bezierCurveTo(-11, -1, -6, -11, 0, -5); g.bezierCurveTo(6, -11, 11, -1, 0, 7); g.fill(); }
    if (type === 'med') { g.fillRect(-2.5, -8, 5, 15); g.fillRect(-7.5, -3, 15, 5); }
    if (type === 'auto') { roundRect(g, -9, -3, 18, 7, 2); g.fill(); g.fillRect(-5, -8, 10, 6); g.fillStyle = t.col; g.beginPath(); g.arc(-5, 5, 2.5, 0, 7); g.arc(5, 5, 2.5, 0, 7); g.fill(); }
    if (type === 'home') { g.beginPath(); g.moveTo(0, -10); g.lineTo(10, -1); g.lineTo(-10, -1); g.closePath(); g.fill(); g.fillRect(-7, -1, 14, 10); g.fillStyle = t.col; g.fillRect(-2, 3, 4, 6); }
  } else if (type === 'boost') {
    g.fillStyle = '#6d4fd6'; g.beginPath(); g.arc(0, 0, 16, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = '900 15px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('×2', 0, 1);
  } else {
    g.fillStyle = '#e04a3c'; roundRect(g, -27, -13, 54, 26, 7); g.fill();
    g.strokeStyle = '#8f1d14'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#fff'; g.font = '800 ' + (t.label.length > 5 ? 9.5 : 11) + 'px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t.label, 0, 1);
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawPig(g, x, y, t, shield, boost){
  g.save(); g.translate(x, y);
  if (shield) { g.strokeStyle = 'rgba(15,138,95,.5)'; g.lineWidth = 4; g.beginPath(); g.ellipse(0, -4, 48, 36, 0, Math.PI, 0); g.stroke(); }
  if (boost) { g.fillStyle = 'rgba(109,79,214,.18)'; g.beginPath(); g.ellipse(0, 0, 50 + Math.sin(t * 10) * 3, 34, 0, 0, 7); g.fill(); }
  g.fillStyle = '#e88aa8';
  g.fillRect(-24, 14, 8, 10); g.fillRect(14, 14, 8, 10);           // ніжки
  g.beginPath(); g.ellipse(0, 0, 36, 24, 0, 0, 7); g.fill();       // тулуб
  g.beginPath(); g.moveTo(-18, -16); g.lineTo(-10, -30); g.lineTo(-4, -18); g.fill(); // вушко
  g.fillStyle = '#d96f92'; g.beginPath(); g.ellipse(34, 2, 9, 8, 0, 0, 7); g.fill(); // п'ятачок
  g.fillStyle = '#9b3b5c'; g.fillRect(31, 0, 2, 4); g.fillRect(36, 0, 2, 4);
  g.fillStyle = '#2b1a20'; g.beginPath(); g.arc(18, -8, 3, 0, 7); g.fill();          // око
  g.fillStyle = '#9b3b5c'; roundRect(g, -14, -25, 26, 5, 2); g.fill();               // проріз для монет
  g.strokeStyle = '#d96f92'; g.lineWidth = 3; g.beginPath(); g.arc(-40, -2, 6, 0.5, 4.5); g.stroke(); // хвостик
  g.restore();
}

// ---------- Стан гри ----------
const G = { running:false, t:0, cap:0, dep:0, items:[], parts:[], floats:[], px:W / 2, tx:W / 2, boostUntil:0, combo:0,
  spawnIn:0, hits:{ good:0, trap:0 }, lost:0, envYears:0, best:load('c60_best', 0), keys:{ l:false, r:false },
  ins:{ policy:false, med:false, auto:false, home:false }, fm:[], fmLost:0, fmSaved:0, fmLog:[], warn:null, startBonus:0 };
// Форс-мажори: від них не втекти, рятує лише страховка
const FM = {
  hosp:  { t:'Лікарня', d:'Операція і тиждень у стаціонарі', ins:'med', pct:0.15, min:6000 },
  dtp:   { t:'ДТП', d:'Ви пошкодили чуже авто', ins:'auto', pct:0.20, min:8000 },
  flood: { t:'Затопили сусідів', d:'Лопнула труба', ins:'home', pct:0.12, min:5000 },
  crit:  { t:'Серйозна хвороба', d:'Дороге лікування і місяці без роботи', ins:'policy', pct:0.35, min:15000 }
};
function planFM(){
  const others = ['hosp','dtp','flood'].sort(() => Math.random() - 0.5);
  const kinds = [others[0], others[1], 'crit', others[2]].sort(() => Math.random() - 0.5);
  const slots = [[13, 19], [25, 32], [38, 45], [50, 56]];
  return kinds.map((k, i) => ({ k, at:slots[i][0] + Math.random() * (slots[i][1] - slots[i][0]), warned:false, done:false }));
}
function hitFM(f){
  const e = FM[f.k], cost = Math.max(e.min, G.cap * e.pct), loss = G.ins[e.ins] ? cost : Math.min(G.cap, cost);
  const age = Math.floor(30 + G.t / GAME_S * YEARS);
  if (G.ins[e.ins]) {
    G.fmSaved += loss; G.fmLog.push({ k:f.k, saved:loss });
    floatText(W / 2, 150, TYPES[e.ins].short + ' покрила ' + Math.round(loss).toLocaleString('uk-UA'), TYPES[e.ins].col);
    burst(G.px, H - 80, TYPES[e.ins].col, 16); SND.block(); haptic('medium');
    G.warn = { text:e.t + ': захист спрацював', sub:TYPES[e.ins].name + ' заплатила ' + money(loss), col:TYPES[e.ins].col, until:performance.now() + 1800 };
  } else {
    G.cap -= loss; G.fmLost += loss; G.combo = 0; G.fmLog.push({ k:f.k, lost:loss });
    floatText(W / 2, 150, '−' + Math.round(loss).toLocaleString('uk-UA'), '#e04a3c');
    burst(G.px, H - 80, '#e04a3c', 20); SND.trap(); haptic('heavy'); G.shakeUntil = performance.now() + 400;
    G.warn = { text:e.t + ' у ' + age + ' р.: −' + money(loss), sub:'Рятувала б: ' + TYPES[e.ins].name.toLowerCase(), col:'#e04a3c', until:performance.now() + 2000 };
  }
}
const money = x => Math.round(x).toLocaleString('uk-UA') + ' грн';
const short = x => x >= 1e6 ? (x / 1e6).toFixed(2).replace('.', ',') + ' млн грн' : money(x);

function pickType(p){
  const w = [['coin', 44 - p * 10], ['bill', 20], ['gold', 3 + p * 3], ['boost', 3],
             ['policy', G.ins.policy ? 0 : (p < 0.35 ? 6 : 2.5)], ['med', G.ins.med ? 0 : 2.6], ['auto', G.ins.auto ? 0 : 2.2], ['home', G.ins.home ? 0 : 2.2],
             ['credit', 6 + p * 5], ['env', 6 + p * 3], ['scam', 4 + p * 5], ['buy', 7 + p * 4]];
  let s = w.reduce((a, b) => a + b[1], 0) * Math.random();
  for (const [k, v] of w) { s -= v; if (s <= 0) return k; } return 'coin';
}
function spawn(p){
  const type = pickType(p), r = TYPES[type].r;
  G.items.push({ type, x:r + 10 + Math.random() * (W - 2 * r - 20), y:-24, vy:150 + p * 130 + Math.random() * 60, wob:Math.random() * 6, rot:0 });
}
function floatText(x, y, text, color){ G.floats.push({ x, y, text, color, life:0.9, age:0 }); }
function burst(x, y, color, n){ for (let i = 0; i < n; i++) G.parts.push({ x, y, vx:(Math.random() - .5) * 220, vy:-Math.random() * 200 - 40, life:0.6, age:0, color }); }
function badges(){
  const b = [];
  if (G.combo >= 5) b.push('<span class="badge">серія ×' + comboMult().toFixed(1).replace('.', ',') + '</span>');
  ['policy','med','auto','home'].forEach(k => { if (G.ins[k]) b.push('<span class="badge" style="background:' + TYPES[k].col + ';color:#fff">' + TYPES[k].short + '</span>'); });
  if (performance.now() < G.boostUntil) b.push('<span class="badge v">складний відсоток ×2</span>');
  const s = b.join(''); if ($('badges').dataset.s !== s) { $('badges').dataset.s = s; $('badges').innerHTML = s; }
}
const comboMult = () => Math.min(3, 1 + Math.floor(G.combo / 5) * 0.5);

function catchItem(it){
  const T = TYPES[it.type], now = performance.now();
  if (T.good) {
    const v = T.val * comboMult(); G.cap += v; G.dep += v; G.combo++; G.hits.good++;
    floatText(it.x, it.y - 10, '+' + Math.round(v), css('--accent')); burst(it.x, it.y, '#f2c94c', it.type === 'gold' ? 14 : 6);
    (it.type === 'coin' ? SND.coin : it.type === 'bill' ? SND.bill : SND.gold)(); haptic('light');
  } else if (T.ins) {
    if (!G.ins[it.type]) { G.ins[it.type] = true; if (it.type === 'policy') G.policyAge = Math.floor(30 + G.t / GAME_S * YEARS); floatText(it.x, it.y - 10, T.short.toUpperCase() + ' ✓', T.col); SND.shield(); haptic('medium'); burst(it.x, it.y, T.col, 12); }
  } else if (it.type === 'boost') {
    G.boostUntil = now + 6000; floatText(it.x, it.y - 10, '×2 ВІДСОТОК', '#6d4fd6'); SND.boost(); haptic('medium'); burst(it.x, it.y, '#6d4fd6', 10);
  } else if (T.trap) {
    let loss = 0;
    if (it.type === 'credit') loss = G.cap * 0.2;
    if (it.type === 'scam') loss = G.cap * 0.3;
    if (it.type === 'env') { loss = 1000; G.envYears++; }
    if (it.type === 'buy') loss = 1500;
    loss = Math.min(loss, G.cap); G.cap -= loss; G.lost += loss; G.combo = 0; G.hits.trap++;
    G.lastTrap = it.type;
    floatText(it.x, it.y - 10, '−' + Math.round(loss), '#e04a3c'); burst(it.x, it.y, '#e04a3c', 12); SND.trap(); haptic('heavy');
    G.shakeUntil = now + 250;
  }
}

// ---------- Цикл ----------
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  if (G.running) update(dt, now);
  draw(now);
}
function update(dt, now){
  G.t += dt; const p = Math.min(1, G.t / GAME_S);
  const r = (now < G.boostUntil ? RATE * 2 : RATE) + (G.ins.policy ? 0.01 : 0);
  G.fm.forEach(f => {
    if (!f.warned && G.t >= f.at - 1.4) { f.warned = true; const e = FM[f.k]; G.warn = { text:'Форс-мажор: ' + e.t, sub:e.d + '. Від цього не втекти', col:'#e04a3c', until:now + 1400, alarm:true }; SND.tick(); haptic('heavy'); }
    if (!f.done && G.t >= f.at) { f.done = true; hitFM(f); }
  });
  G.cap *= Math.pow(1 + r, dt * YEARS / GAME_S);
  if (G.keys.l) G.tx -= 360 * dt; if (G.keys.r) G.tx += 360 * dt;
  G.tx = Math.max(40, Math.min(W - 40, G.tx));
  G.px += (G.tx - G.px) * Math.min(1, dt * 18);
  G.spawnIn -= dt; if (G.spawnIn <= 0) { spawn(p); G.spawnIn = 0.58 - p * 0.28 + Math.random() * 0.15; }
  const py = H - 58;
  G.items = G.items.filter(it => {
    it.y += it.vy * dt; it.x += Math.sin(G.t * 3 + it.wob) * 12 * dt;
    if (it.y > py - 30 && it.y < py + 10 && Math.abs(it.x - G.px) < 38) { catchItem(it); return false; }
    return it.y < H + 30;
  });
  G.parts = G.parts.filter(q => { q.age += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; return q.age < q.life; });
  G.floats = G.floats.filter(f => { f.age += dt; f.y -= 40 * dt; return f.age < f.life; });
  const sec = Math.ceil(GAME_S - G.t); if (sec <= 3 && sec !== G.lastTick && sec > 0) { G.lastTick = sec; SND.tick(); }
  $('cap').textContent = money(G.cap); $('dep').textContent = money(G.dep);
  $('ageL').textContent = Math.floor(30 + p * YEARS) + ' р.'; $('ageBar').style.width = p * 100 + '%';
  badges();
  if (G.t >= GAME_S) finish();
}
function draw(now){
  const g = ctx; g.setTransform(scale, 0, 0, scale, 0, 0);
  if (now < (G.shakeUntil || 0)) g.translate((Math.random() - .5) * 6, (Math.random() - .5) * 6);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, css('--sky1')); sky.addColorStop(1, css('--sky2'));
  g.fillStyle = sky; g.fillRect(-10, -10, W + 20, H + 20);
  // фон: «графік зростання» за спиною
  const p = Math.min(1, G.t / GAME_S);
  g.strokeStyle = 'rgba(15,138,95,.12)'; g.lineWidth = 3; g.beginPath();
  for (let i = 0; i <= 40; i++) { const x = i / 40 * W, y = H - 120 - Math.pow(i / 40, 2.2) * 260 * (0.3 + p * 0.7); i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  g.fillStyle = 'rgba(15,138,95,.10)'; g.fillRect(0, H - 34, W, 34);
  if (now < G.boostUntil) { g.fillStyle = 'rgba(109,79,214,.06)'; g.fillRect(0, 0, W, H); }
  G.items.forEach(it => drawItem(g, it.type, it.x, it.y));
  drawPig(g, G.px, H - 58, G.t, G.ins.policy, now < G.boostUntil);
  if (G.warn && now < G.warn.until) {
    const bl = G.warn.alarm && Math.floor(now / 180) % 2;
    g.fillStyle = bl ? 'rgba(224,74,60,.95)' : G.warn.col; roundRect(g, 14, 16, W - 28, 58, 12); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = '800 17px system-ui,sans-serif'; g.fillText(G.warn.text, W / 2, 41);
    g.font = '500 12.5px system-ui,sans-serif'; g.fillText(G.warn.sub, W / 2, 62);
    if (G.warn.alarm) { g.fillStyle = 'rgba(224,74,60,.10)'; g.fillRect(0, 0, W, H); }
  }
  G.parts.forEach(q => { g.globalAlpha = 1 - q.age / q.life; g.fillStyle = q.color; g.fillRect(q.x - 2, q.y - 2, 4, 4); });
  g.globalAlpha = 1;
  G.floats.forEach(f => { g.globalAlpha = 1 - f.age / f.life; g.font = '800 16px system-ui,sans-serif'; g.textAlign = 'center';
    g.lineWidth = 4; g.strokeStyle = css('--card'); g.strokeText(f.text, f.x, f.y); g.fillStyle = f.color; g.fillText(f.text, f.x, f.y); });
  g.globalAlpha = 1;
}

// ---------- Керування ----------
function toX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} G.tx = toX(e); });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) G.tx = toX(e); });
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') G.keys.l = true; if (e.key === 'ArrowRight' || e.key === 'd') G.keys.r = true; });
window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') G.keys.l = false; if (e.key === 'ArrowRight' || e.key === 'd') G.keys.r = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.running) { G.running = false; G.paused = true; showPause(); } });
$('mute').onclick = () => { ainit(); A.on = !A.on; save('c60_sound', A.on); setSnd(); };

// ---------- Екрани ----------
const over = $('over');
function icon(type){ const c = document.createElement('canvas'); c.width = 60; c.height = 60; const g = c.getContext('2d'); g.scale(2, 2);
  if (type === 'boost') { g.fillStyle = '#e04a3c'; g.beginPath(); g.moveTo(15, 2); g.lineTo(28, 26); g.lineTo(2, 26); g.closePath(); g.fill(); g.fillStyle = '#fff'; g.font = '900 15px system-ui'; g.textAlign = 'center'; g.fillText('!', 15, 23); return c; }
  drawItem(g, type, 15, 15, type === 'credit' || type === 'buy' ? 0.5 : 0.85); return c; }
const CHAL = [
  { t:'Зберіть понад 60 000 грн', ok:() => G.cap >= 60000 },
  { t:'Впіймайте всі 4 страховки', ok:() => Object.values(G.ins).every(Boolean) },
  { t:'Не впіймайте жодної пастки', ok:() => G.hits.trap === 0 },
  { t:'Переживіть усі форс-мажори без втрат', ok:() => G.fmLost === 0 },
  { t:'Впіймайте поліс до 35 років', ok:() => G.policyAge && G.policyAge <= 35 },
  { t:'Зберіть понад 100 000 грн', ok:() => G.cap >= 100000 }
];
const STREAK_BONUS = [0, 1000, 2000, 3000, 4000, 5000, 10000];
const dayStr = d => d.toISOString().slice(0, 10);
function dayInfo(){
  const D = load('c60_day', { last:null, streak:0, chalDate:null, chalDone:false });
  const today = dayStr(new Date()), yest = dayStr(new Date(Date.now() - 864e5));
  const chal = CHAL[Math.floor(Date.now() / 864e5) % CHAL.length];
  const streakNow = D.last === today ? D.streak : D.last === yest ? D.streak : 0;
  return { D, today, yest, chal, streakNow, chalDone:D.chalDate === today && D.chalDone };
}
function showStart(){
  over.hidden = false;
  const I = dayInfo(), nextStreak = I.D.last === I.today ? I.streakNow : I.streakNow + 1;
  const bonus = I.D.last === I.today ? 0 : STREAK_BONUS[Math.min(7, nextStreak) - 1];
  over.innerHTML = '<div class="in"><h1>Капітал за 60 секунд</h1>' +
    '<p class="lead">Вам 30. За хвилину пролетять 30 років до пенсії. Ловіть внески і страховки, оминайте пастки. Все зібране росте на 8% на рік.</p>' +
    '<div class="legend">' +
      '<div><span data-i="coin"></span><span><b>Внески</b><span>100, 500, 2000 грн</span></span></div>' +
      '<div><span data-i="policy"></span><span><b>Захист</b><span>поліс, медична, авто, житло. Діють до кінця гри</span></span></div>' +
      '<div><span data-i="credit"></span><span><b>Пастки</b><span>кредит, конверт, шахраї, «хочу!» — оминайте</span></span></div>' +
      '<div><span data-i="boost"></span><span><b>Форс-мажори</b><span>від них не втекти. Рятує тільки страховка</span></span></div>' +
    '</div>' +
    '<div class="split"><div><b>' + Math.max(1, nextStreak) + ' ' + (nextStreak === 1 ? 'день' : 'дн.') + ' поспіль</b><span>' + (bonus ? 'бонус на старті +' + bonus.toLocaleString('uk-UA') + ' грн' : 'бонус на сьогодні вже взято') + '</span></div>' +
      '<div><b>' + (I.chalDone ? 'Виконано ✓' : 'Челендж дня') + '</b><span>' + I.chal.t + '</span></div></div>' +
    '<p class="lead" style="font-size:.85rem">Водіть пальцем по полю. Поліс краще впіймати першим: він захищає від найдорожчого.</p>' +
    '<button class="btn main" id="go" type="button">Почати</button></div>';
  over.querySelectorAll('[data-i]').forEach(el => el.replaceWith(icon(el.dataset.i)));
  $('go').onclick = countdown;
}
function showPause(){
  over.hidden = false;
  over.innerHTML = '<div class="in"><h2>Пауза</h2><p class="lead">Капітал чекає на вас.</p><button class="btn main" id="resume" type="button">Продовжити</button></div>';
  $('resume').onclick = () => { over.hidden = true; G.paused = false; G.running = true; last = 0; };
}
async function countdown(){
  ainit(); haptic('medium');
  const I = dayInfo(); let bonus = 0;
  if (I.D.last !== I.today) { const st = I.D.last === I.yest ? I.D.streak + 1 : 1; bonus = STREAK_BONUS[Math.min(7, st) - 1]; I.D.streak = st >= 7 ? 0 : st; if (st >= 7) I.D.streak = 7; I.D.last = I.today; save('c60_day', I.D); }
  Object.assign(G, { running:false, t:0, cap:bonus, dep:bonus, items:[], parts:[], floats:[], px:W / 2, tx:W / 2, boostUntil:0, combo:0, spawnIn:0.3,
    hits:{ good:0, trap:0 }, lost:0, envYears:0, lastTick:0, lastTrap:null, ins:{ policy:false, med:false, auto:false, home:false },
    fm:planFM(), fmLost:0, fmSaved:0, fmLog:[], warn:null, policyAge:0, startBonus:bonus });
  if (bonus) G.warn = { text:'Бонус серії: +' + bonus.toLocaleString('uk-UA') + ' грн', sub:'Заходьте щодня, і бонус росте', col:'#0f8a5f', until:performance.now() + 4000 };
  over.hidden = true; const c = $('count'); c.hidden = false;
  for (const n of ['3', '2', '1']) { c.textContent = n; SND.tick(); await new Promise(r => setTimeout(r, 600)); }
  c.hidden = true; last = 0; G.running = true;
}
function finish(){
  G.running = false; G.items = []; SND.end(); haptic('heavy');
  const growth = Math.max(0, G.cap - G.dep + G.lost + G.fmLost);
  const isBest = G.cap > G.best; if (isBest) { G.best = G.cap; save('c60_best', G.best); }
  $('best').textContent = money(G.best);
  const grade = G.cap >= 150000 ? ['', 'Фінансовий геній'] : G.cap >= 80000 ? ['', 'Надійний інвестор'] : G.cap >= 30000 ? ['', 'Непоганий старт'] : ['low', 'Капітал під загрозою'];
  const tips = [];
  const names = { hosp:'лікарня', dtp:'ДТП', flood:'затоплення', crit:'серйозна хвороба' };
  const lostL = G.fmLog.filter(x => x.lost), savedL = G.fmLog.filter(x => x.saved);
  if (lostL.length) tips.push('Форс-мажори забрали <b>' + money(G.fmLost) + '</b>: ' + lostL.map(x => names[x.k]).join(', ') + '. Зі страховками ці гроші лишилися б вашими.');
  if (savedL.length) tips.push('Страховки зберегли <b>' + money(G.fmSaved) + '</b>: ' + savedL.map(x => names[x.k]).join(', ') + '.');
  if (!G.ins.policy) tips.push('Ви грали без поліса. А серйозна хвороба може статися з кожним: саме поліс страхування життя закриває найдорожчі ризики. Це фундамент.');
  else tips.push('Поліс з ' + G.policyAge + ' років захищав від найдорожчого і додавав +1% до росту капіталу.');
  if (G.hits.trap) tips.push('Пастки забрали ' + money(G.lost) + '. Кредити й «легкі гроші» в житті з’їдають накопичення так само.');
  if (G.envYears) tips.push('Конверт: ' + G.envYears + ' р. без офіційного стажу — це мінус і до державної пенсії.');
  tips.push('Найбільше виросли внески, впіймані на початку: вони працювали найдовше.');
  const I = dayInfo(); let chalLine = '';
  if (!I.chalDone && I.chal.ok()) { I.D.chalDate = I.today; I.D.chalDone = true; save('c60_day', I.D); chalLine = '<span class="grade">Челендж дня виконано: ' + I.chal.t + '</span>'; }
  else if (!I.chalDone) chalLine = '<span class="grade low">Челендж дня: ' + I.chal.t + '</span>';
  const text = 'Я зібрав ' + short(G.cap) + ' за 60 секунд у грі «Капітал». А ти?';
  over.hidden = false;
  over.innerHTML = '<div class="in"><h2>Вам 60. Ваш капітал:</h2><div class="res">' + short(G.cap) + '</div>' +
    '<span class="grade ' + grade[0] + '">' + grade[1] + (isBest ? ' · новий рекорд!' : '') + '</span>' +
    '<div class="split"><div><b>' + short(G.dep) + '</b><span>ви внесли</span></div><div><b>+' + short(growth) + '</b><span>дав складний відсоток</span></div></div>' + chalLine +
    '<div class="tip">' + tips.join('<br><br>') + '</div>' +
    '<button class="btn main" id="real" type="button">Перевірити мій реальний захист</button>' +
    '<button class="btn" id="share" type="button">Кинути виклик друзям</button>' +
    '<button class="btn" id="again" type="button">Зіграти ще раз</button>' +
    '<p class="fine">Гра умовна: 8% на рік — ілюстрація, а не обіцянка дохідності. Умови реальних страховок залежать від програми.</p></div>';
  $('real').onclick = () => {
    const data = JSON.stringify({ a:'game', g:{ cap:Math.round(G.cap), dep:Math.round(G.dep), ins:Object.keys(G.ins).filter(k => G.ins[k]),
      fmLost:Math.round(G.fmLost), fmSaved:Math.round(G.fmSaved), traps:G.hits.trap, policyAge:G.policyAge || 0 } });
    window.toBot(data, 'game').then(ok => { if (!ok && BOT_USERNAME) openLink('https://t.me/' + BOT_USERNAME + '?start=game'); });
  };
  $('share').onclick = () => openLink('https://t.me/share/url?url=' + encodeURIComponent(BOT_USERNAME ? 'https://t.me/' + BOT_USERNAME + '?start=game' : location.href.split('?')[0]) + '&text=' + encodeURIComponent(text));
  if (!BOT_USERNAME && !(tg && tg.initData)) $('share').hidden = true;
  $('again').onclick = countdown;
}

// ---------- Старт ----------
$('best').textContent = money(G.best); setSnd(); resize();
// демо-кадр під стартовим екраном
G.items = [{ type:'coin', x:80, y:160, vy:0, wob:0 }, { type:'bill', x:250, y:110, vy:0, wob:1 }, { type:'credit', x:180, y:260, vy:0, wob:2 }, { type:'policy', x:290, y:330, vy:0, wob:3 }];
showStart();
requestAnimationFrame(frame);
})();
</script>

<script>document.querySelectorAll('.navtabs .on,.tabs .on').forEach(b=>{try{b.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}})</script>
